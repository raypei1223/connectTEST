<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>P2P接続テスト</title>
<style>
:root{--bg:#101418;--pn:#1a2027;--tx:#dfe6ec;--dim:#8794a1;--ok:#5fd38d;--warn:#f2b84b;--ng:#ff6b6b;--ac:#6cb6ff}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;max-width:860px;margin-inline:auto}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:16px;margin:0 0 8px;color:var(--ac)}
h3{font-size:14px;margin:10px 0 4px}
.dim{color:var(--dim)}
section{background:var(--pn);border-radius:8px;padding:12px 14px;margin:12px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
input{background:#0b0e11;color:var(--tx);border:1px solid #33404c;border-radius:6px;padding:8px 10px;font-size:15px;min-width:0}
#room{flex:1 1 160px}#root{width:130px}
button{background:#2a3744;color:var(--tx);border:1px solid #3d4d5c;border-radius:6px;padding:8px 14px;font-size:14px;cursor:pointer}
button.main{background:var(--ac);color:#06121d;border-color:var(--ac);font-weight:700}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
table{width:100%;border-collapse:collapse}
th{width:34%;text-align:left;vertical-align:top;font-weight:400;color:var(--dim);padding:3px 8px 3px 0;font-size:13px}
td{padding:3px 0;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all}
ul{list-style:none;margin:0;padding:0}
li{padding:3px 0 3px 22px;position:relative}
li::before{position:absolute;left:0}
.ok{color:var(--ok)}.warn{color:var(--warn)}.ng{color:var(--ng)}.info{color:var(--tx)}
li.ok::before{content:"✓"}li.warn::before{content:"⚠"}li.ng::before{content:"✗"}li.info::before{content:"・"}
#log{height:240px;overflow:auto;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;background:#0b0e11;border-radius:6px;padding:8px}
#log div{white-space:pre-wrap;word-break:break-all}
.small{font-size:13px}
</style>
</head>
<body>
<h1>P2P接続テスト</h1>
<p class="dim small">2台以上のブラウザで、同じ合言葉を入れて「接続する」を押します。先に入った人がホスト、後の人がゲストになります（ゲームと同じ星形接続）。接続の詳細と、つながらない原因の見立てを表示します。</p>

<div class="row">
  <input id="room" placeholder="合言葉（例: test1）" autocomplete="off">
  <input id="root" value="p2ptest" title="Firebaseの保存先パス" aria-label="Firebaseの保存先パス">
  <button id="go" class="main">接続する</button>
  <button id="again" disabled>やり直し</button>
</div>
<div class="row">
  <button id="srv">STUN/TURN単体テスト</button>
  <button id="copy">結果をコピー</button>
</div>

<section><h2>診断</h2><ul id="diag"></ul></section>
<section><h2>接続相手ごとの詳細</h2><div id="peers"></div></section>
<section><h2>状態</h2><div id="status"></div></section>
<section><h2>STUN/TURN単体テスト結果</h2><div class="dim small">各サーバーを1つずつ試し、応答があるかを調べます（接続しなくても使えます）。</div><div id="srvres"></div></section>
<section><h2>環境</h2><div id="env"></div></section>
<section><h2>ログ</h2><div id="log" aria-live="off"></div></section>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script>
// ゲーム(werewolf.html)と同じFirebase設定・同じICEサーバー設定
const FIREBASE_CONFIG={apiKey:"AIzaSyDslYy-jLIkZbd8jpr-9t9zmRD0fdsDwpI",authDomain:"zomikasudungeon.firebaseapp.com",databaseURL:"https://zomikasudungeon-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"zomikasudungeon",storageBucket:"zomikasudungeon.firebasestorage.app",messagingSenderId:"637820964372",appId:"1:637820964372:web:d6e7e0470ade987ffe6101"};
const U='efbb50b419e72c3d78c12f99',C='KjZehIXmo2kC00Tb';
const RTC_CONFIG={iceServers:[
 {urls:'stun:stun.relay.metered.ca:80'},
 {urls:'turn:global.relay.metered.ca:80',username:U,credential:C},
 {urls:'turn:global.relay.metered.ca:80?transport=tcp',username:U,credential:C},
 {urls:'turn:global.relay.metered.ca:443',username:U,credential:C},
 {urls:'turns:global.relay.metered.ca:443?transport=tcp',username:U,credential:C}]};

const $=id=>document.getElementById(id);
const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now=()=>performance.now();
const ms=n=>n==null||isNaN(n)?'-':Math.round(n)+'ms';
let S,tStart=now(),db=null,base=null,refs=[],logs=[];
function fresh(){S={peers:new Map(),issues:[],role:'-',uid:null,hostUid:null,fb:{},running:false,srv:null,root:'p2ptest'};}
fresh();

function log(m,cls){const t=((now()-tStart)/1000).toFixed(2).padStart(6);const line=`[${t}s] ${m}`;logs.push(line);const d=document.createElement('div');d.textContent=line;if(cls)d.className=cls;const L=$('log');L.appendChild(d);L.scrollTop=L.scrollHeight;}
function issue(lv,text){if(!S.issues.some(i=>i.text===text))S.issues.push({lv,text});log(text,lv);}
const HINT={701:'サーバーに到達できません（ポート遮断/UDP制限/サーバー停止）',401:'認証失敗（TURNのユーザー名・パスワードが無効か期限切れ）',403:'権限エラー',437:'割り当て不一致',438:'nonce期限切れ',486:'割り当て上限超過（無料枠や同時接続数の上限の可能性）',508:'割り当て不足'};
function fbErr(w,e){const c=e&&(e.code||e.message)||String(e);let h='';
 if(/permission/i.test(c))h=` → Firebaseのルールで拒否されました。ルールに "${S.root}":{".read":"auth != null",".write":"auth != null"} を追加するか、左上の保存先パスをゲームが許可している rooms/ 配下に変えると通る場合があります`;
 else if(/unauthorized-domain/.test(c))h=' → このページのドメインがFirebaseの承認済みドメインにありません。ゲームと同じ場所に置くか、Authentication→設定→承認済みドメインに追加してください';
 else if(/operation-not-allowed|admin-restricted/.test(c))h=' → Firebase Authenticationで「匿名」ログインが無効です';
 else if(/network/i.test(c))h=' → Firebaseの認証サーバーへ通信できません（回線やブロックの可能性）';
 issue('ng',`${w}に失敗: ${c}${h}`);}
const nm=P=>P.role==='host'?'ホスト':'ゲスト'+P.uid.slice(0,4);
function parseCand(s){const a=String(s).split(' ');return{proto:a[2],addr:a[4],port:a[5],type:a[7]};}

function setBtns(){$('go').disabled=S.running;$('again').disabled=!S.role||S.role==='-';}

async function start(){
 if(S.running)return;
 const room=$('room').value.trim();if(!room){$('room').focus();return;}
 const root=($('root').value.trim()||'p2ptest').replace(/^\/+|\/+$/g,'');
 const keepSrv=S.srv;fresh();S.srv=keepSrv;S.root=root;logs.length=0;$('log').innerHTML='';tStart=now();S.running=true;setBtns();
 log(`開始: 合言葉="${room}" 保存先=${root}`);
 if(typeof RTCPeerConnection==='undefined'){issue('ng','このブラウザはWebRTC(RTCPeerConnection)が使えません');return fin();}
 if(typeof firebase==='undefined'){issue('ng','Firebase SDKを読み込めませんでした。gstatic.com に届かない環境です（この状態ではゲームの協力プレイも使えません）');return fin();}
 try{
  if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
  db=firebase.database();
  let t=now();
  await firebase.auth().setPersistence(firebase.auth.Auth.Persistence.NONE).catch(()=>{});
  const cred=await firebase.auth().signInAnonymously();
  S.uid=cred.user.uid;S.fb.auth=now()-t;
  log(`匿名ログイン成功 (${ms(S.fb.auth)}) uid=${S.uid.slice(0,6)}…`,'ok');
 }catch(e){fbErr('匿名ログイン',e);return fin();}
 const ir=db.ref('.info/connected');const ih=ir.on('value',s=>{S.fb.conn=s.val();log('Firebase接続: '+(s.val()?'接続中':'切断'),s.val()?'':'warn');});
 refs.push(()=>ir.off('value',ih));
 base=db.ref(`${root}/${room.replace(/[.#$\[\]\/]/g,'_')}`);
 try{
  let t=now();await base.child('ping/'+S.uid).set(firebase.database.ServerValue.TIMESTAMP);S.fb.write=now()-t;
  t=now();await base.child('ping/'+S.uid).once('value');S.fb.read=now()-t;
  log(`Firebase書込 ${ms(S.fb.write)} / 読込 ${ms(S.fb.read)}`);
  base.child('ping/'+S.uid).onDisconnect().remove();
 }catch(e){fbErr('Firebaseへの書き込み',e);return fin();}
 let tr;
 try{tr=await base.child('host').transaction(cur=>cur?undefined:{uid:S.uid,ts:Date.now(),ready:false});}
 catch(e){fbErr('ホスト決定',e);return fin();}
 if(tr.committed){
  S.role='host';S.hostUid=S.uid;setBtns();
  base.child('host').onDisconnect().remove();
  await base.update({offers:null,answers:null,candidates:null});
  await base.child('host/ready').set(true);
  log('あなたはホストです。ゲストの接続を待っています…','ok');
  const r=base.child('offers'),f=s=>onOffer(s);
  r.on('child_added',f);r.on('child_changed',f);refs.push(()=>{r.off('child_added',f);r.off('child_changed',f);});
 }else{
  S.role='guest';setBtns();
  log('あなたはゲストです。ホストの準備を待っています…','ok');
  const hr=base.child('host');
  const f=s=>{const v=s.val();
   if(!v){if(S.hostUid)log('ホストの登録が消えました（ホストが離脱）','warn');return;}
   if(!v.ready||S.hostUid===v.uid)return;
   S.hostUid=v.uid;connectToHost(v.uid).catch(e=>issue('ng','ゲスト側の接続処理に失敗: '+e.message));};
  hr.on('value',f);refs.push(()=>hr.off('value',f));
 }
}
function fin(){S.running=false;setBtns();}

async function stop(){
 refs.forEach(f=>{try{f()}catch(e){}});refs=[];
 const wasHost=S.role==='host';
 S.peers.forEach(closePeer);
 try{if(wasHost&&base){await base.child('host').remove();await base.update({offers:null,answers:null,candidates:null});}
  if(base&&S.uid)await base.child('ping/'+S.uid).remove();}catch(e){}
 const s=S.srv;fresh();S.srv=s;setBtns();
}
function closePeer(P){clearInterval(P.ping);clearInterval(P.poll);P.off.forEach(f=>{try{f()}catch(e){}});try{P.pc&&P.pc.close()}catch(e){}}

function newPeer(uid,role,gen){
 const old=S.peers.get(uid);if(old)closePeer(old);
 const P={uid,role,gen,pc:null,dc:null,local:[],remote:[],errors:[],st:{},gather:'new',tCreate:now(),tConn:null,tDc:null,rtts:[],sent:0,got:0,pair:null,pairs:null,timeout:false,q:[],off:[],ping:null,poll:null};
 S.peers.set(uid,P);
 P.failTimer=setTimeout(()=>{if(!P.tConn){P.timeout=true;log(`15秒以内に接続できませんでした (${nm(P)})`,'ng');}},15000);
 P.off.push(()=>clearTimeout(P.failTimer));
 return P;
}
function wirePc(P,pushRef){
 const pc=P.pc=new RTCPeerConnection(RTC_CONFIG);
 pc.onicecandidate=e=>{
  if(!e.candidate){log(`ICE候補の収集が完了 (${nm(P)})`);return;}
  const c=e.candidate,p=parseCand(c.candidate);
  const r={type:c.type||p.type,proto:c.protocol||p.proto,addr:c.address||p.addr,port:c.port||p.port,url:e.url||'',tcp:c.tcpType||''};
  P.local.push(r);log(`自分の候補: ${r.type} ${r.proto} ${r.addr}:${r.port} ${r.url?'['+r.url+']':''}`);
  pushRef.push(c.toJSON()).catch(err=>fbErr('ICE候補のFirebase書き込み',err));
 };
 pc.onicegatheringstatechange=()=>{P.gather=pc.iceGatheringState;log(`iceGatheringState=${P.gather}`);};
 pc.onicecandidateerror=e=>{P.errors.push({code:e.errorCode,text:e.errorText,url:e.url,addr:e.address,port:e.port});log(`ICEエラー ${e.errorCode} ${e.errorText||''} url=${e.url||'-'} (${HINT[e.errorCode]||'不明'})`,'ng');};
 pc.onsignalingstatechange=()=>{P.st.sig=pc.signalingState;log(`signalingState=${pc.signalingState}`);};
 pc.oniceconnectionstatechange=()=>{P.st.ice=pc.iceConnectionState;log(`iceConnectionState=${pc.iceConnectionState}`,pc.iceConnectionState==='failed'?'ng':'');};
 pc.onconnectionstatechange=()=>{
  P.st.conn=pc.connectionState;log(`connectionState=${pc.connectionState} (${nm(P)})`,pc.connectionState==='failed'?'ng':(pc.connectionState==='connected'?'ok':''));
  if(pc.connectionState==='connected'&&!P.tConn){P.tConn=now();log(`接続完了 (開始から ${ms(P.tConn-P.tCreate)})`,'ok');P.poll=setInterval(()=>pollStats(P),1000);pollStats(P);}
 };
 return pc;
}
function addRemote(P,c){
 if(!c)return;const p=parseCand(c.candidate||'');P.remote.push({type:p.type,proto:p.proto,addr:p.addr,port:p.port});
 if(!P.pc.remoteDescription){P.q.push(c);return;}
 P.pc.addIceCandidate(c).catch(e=>log('addIceCandidate失敗: '+e.message,'warn'));
}
function flushQ(P){P.q.splice(0).forEach(c=>P.pc.addIceCandidate(c).catch(e=>log('addIceCandidate失敗: '+e.message,'warn')));}
function listen(P,ref,ev,fn){ref.on(ev,fn);P.off.push(()=>ref.off(ev,fn));}
function setupDc(P,dc){
 P.dc=dc;
 dc.onopen=()=>{P.tDc=now();log(`DataChannel open (${nm(P)}) 開始から ${ms(P.tDc-P.tCreate)}`,'ok');
  P.ping=setInterval(()=>{if(dc.readyState!=='open')return;P.sent++;try{dc.send(JSON.stringify({k:'p',i:P.sent,t:now()}))}catch(e){}},1000);};
 dc.onclose=()=>log(`DataChannel close (${nm(P)})`,'warn');
 dc.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}
  if(m.k==='p'){try{dc.send(JSON.stringify({k:'q',i:m.i,t:m.t}))}catch(x){}}
  else if(m.k==='q'){P.got++;P.rtts.push(now()-m.t);if(P.rtts.length>60)P.rtts.shift();}};
}

// ホスト側：ゲストのofferを受けてanswerを返す
function onOffer(s){
 const v=s.val(),gu=s.key;if(!v||!v.gen)return;
 const old=S.peers.get(gu);if(old&&old.gen===v.gen)return;
 hostAccept(gu,v).catch(e=>issue('ng','ホスト側のオファー処理に失敗: '+e.message));
}
async function hostAccept(gu,offer){
 const gen=offer.gen,P=newPeer(gu,'guest',gen);
 log(`ゲスト ${gu.slice(0,4)} のofferを受信`);
 const pc=wirePc(P,base.child(`candidates/${gu}/host/${gen}`));
 pc.ondatachannel=e=>setupDc(P,e.channel);
 await pc.setRemoteDescription({type:offer.type,sdp:offer.sdp});
 flushQ(P);
 await pc.setLocalDescription(await pc.createAnswer());
 await base.child(`answers/${gu}/${gen}`).set({type:pc.localDescription.type,sdp:pc.localDescription.sdp});
 log('answerを送信');
 listen(P,base.child(`candidates/${gu}/guest/${gen}`),'child_added',s=>addRemote(P,s.val()));
}
// ゲスト側：ホストへofferを送る
async function connectToHost(hu){
 const gen=Date.now(),P=newPeer(hu,'host',gen);
 log('ホストへ接続開始');
 const pc=wirePc(P,base.child(`candidates/${S.uid}/guest/${gen}`));
 setupDc(P,pc.createDataChannel('t',{ordered:false,maxRetransmits:0}));
 await pc.setLocalDescription(await pc.createOffer());
 await base.child(`offers/${S.uid}`).set({type:pc.localDescription.type,sdp:pc.localDescription.sdp,gen,ts:firebase.database.ServerValue.TIMESTAMP});
 log('offerを送信');
 let got=false;
 listen(P,base.child(`answers/${S.uid}/${gen}`),'value',async s=>{
  const v=s.val();if(!v||got)return;got=true;log('answerを受信');
  try{await pc.setRemoteDescription({type:v.type,sdp:v.sdp});flushQ(P);}catch(e){issue('ng','answerの適用に失敗: '+e.message);return;}
  listen(P,base.child(`candidates/${S.uid}/host/${gen}`),'child_added',s2=>addRemote(P,s2.val()));
 });
}

const cdesc=c=>c?`${c.candidateType} ${c.protocol} ${c.address||c.ip||'?'}:${c.port}${c.relayProtocol?' (中継:'+c.relayProtocol+')':''}`:'?';
async function pollStats(P){
 try{
  const st=await P.pc.getStats(),by={};let pid=null,pair=null;const cnt={};
  st.forEach(r=>{by[r.id]=r;if(r.type==='transport'&&r.selectedCandidatePairId)pid=r.selectedCandidatePairId;if(r.type==='candidate-pair')cnt[r.state]=(cnt[r.state]||0)+1;});
  pair=pid?by[pid]:null;
  if(!pair)st.forEach(r=>{if(r.type==='candidate-pair'&&(r.selected||(r.nominated&&r.state==='succeeded')))pair=r;});
  P.pairs=cnt;
  if(pair)P.pair={l:cdesc(by[pair.localCandidateId]),r:cdesc(by[pair.remoteCandidateId]),rtt:pair.currentRoundTripTime,out:pair.availableOutgoingBitrate,bs:pair.bytesSent,br:pair.bytesReceived};
 }catch(e){}
}

const cntBy=(a,k)=>a.reduce((o,x)=>(o[x[k]]=(o[x[k]]||0)+1,o),{});
const fmtCnt=o=>Object.keys(o).length?Object.entries(o).map(([k,v])=>`${k} ${v}`).join(' / '):'なし';
function rttStat(P){if(!P.rtts.length)return null;const a=P.rtts,sum=a.reduce((x,y)=>x+y,0);return{last:a[a.length-1],avg:sum/a.length,min:Math.min(...a),max:Math.max(...a)};}
function lossPct(P){const n=P.sent-1;return n>=3?Math.max(0,n-P.got)/n*100:null;}
const relayed=P=>P.pair&&/relay/.test(P.pair.l+' '+P.pair.r);

function diagnose(){
 const out=[...S.issues];const add=(lv,t)=>out.push({lv,text:t});
 for(const P of S.peers.values()){
  const n=`[${nm(P)}] `,c=cntBy(P.local,'type'),done=P.gather==='complete',age=(now()-P.tCreate)/1000;
  if(done&&!P.local.length)add('ng',n+'自分側のICE候補が1つもできていません。ブラウザの設定・拡張機能・組織のポリシーでWebRTCが止められている可能性があります');
  else if(done&&!c.srflx&&!c.relay)add('ng',n+'STUNにもTURNにも応答がありません。外向きのUDP/TCPが広く遮断されているか、サーバーへ届いていません（下の単体テストで確認）');
  else{
   if(done&&!c.srflx)add('warn',n+'STUNの応答なし。UDPが遮断されている可能性（グローバルIPを知れないため直接接続は期待できません）');
   if(done&&!c.relay)add('warn',n+'TURN（中継）候補ができていません。認証情報の失効・無料枠超過・ポート遮断の可能性。単体テストで原因のサーバーを特定できます');
  }
  const ec={};P.errors.forEach(e=>{ec[e.code]=(ec[e.code]||0)+1;});
  for(const k in ec)add('ng',`${n}ICEエラー ${k} ×${ec[k]}：${HINT[k]||'詳細不明'}`);
  if(!P.local.length||!P.local.some(x=>!/\.local$/.test(x.addr||'')))if(P.local.length&&!c.srflx&&!c.relay)add('info',n+'自分のホスト候補はmDNS名(.local)のみです。同じLAN内でも相手が名前解決できないと直結できません');
  if(!P.tConn&&P.remote.length===0&&age>6)add('ng',n+'相手のICE候補が届いていません。Firebase経由の受け渡しが止まっているか、相手が接続処理に失敗しています');
  if(P.st.conn==='connected')add(relayed(P)?'warn':'ok',n+(relayed(P)?'接続成功（TURN中継経由）。直接つながらない回線ですが、実用上は通信できています。遅延は増えます':'接続成功（直接P2P）'));
  else if(P.st.conn==='failed')add('ng',n+'接続失敗（ICE failed）。両側のNAT/ファイアウォールで直接接続できず、TURN中継も使えなかった状態です');
  else if(P.timeout)add('ng',n+'15秒以内に接続できませんでした（ゲーム側でも「接続できませんでした」が出る状態）');
  if(P.st.conn==='disconnected')add('warn',n+'接続が一時的に切れています');
  if(P.tConn&&!P.tDc&&(now()-P.tConn)>3000)add('warn',n+'接続済みなのにDataChannelが開きません');
  const r=rttStat(P),lp=lossPct(P);
  if(r&&r.avg>300)add('warn',`${n}往復遅延が大きい（平均 ${ms(r.avg)}）`);
  if(lp!=null&&lp>10)add('warn',`${n}パケット損失が多い（約${lp.toFixed(0)}%）`);
 }
 if(S.role==='host'&&S.peers.size===0)add('info','ゲストの接続を待っています。別の端末で同じ合言葉を入れてください');
 if(S.role==='guest'&&S.peers.size===0&&S.running)add('info','ホストの準備を待っています');
 return out;
}
function peerRows(P){
 const c=cntBy(P.local,'type'),rc=cntBy(P.remote,'type'),r=rttStat(P),lp=lossPct(P);
 const rows=[
  ['接続状態',`connection=${P.st.conn||'-'} / ice=${P.st.ice||'-'} / signaling=${P.st.sig||'-'} / 収集=${P.gather}`,P.st.conn==='connected'?'ok':(P.st.conn==='failed'?'ng':'')],
  ['接続までの時間',P.tConn?ms(P.tConn-P.tCreate):`未接続 (${((now()-P.tCreate)/1000).toFixed(1)}秒経過)`],
  ['DataChannel',P.dc?P.dc.readyState+(P.tDc?` (${ms(P.tDc-P.tCreate)})`:''):'-'],
  ['選ばれた経路',P.pair?`自分 ${P.pair.l}\n相手 ${P.pair.r}\n→ ${relayed(P)?'TURN中継':'直接'}`:'-'],
  ['候補ペア',P.pairs?fmtCnt(P.pairs):'-'],
  ['自分の候補',fmtCnt(c)+(P.local.length?'\n'+P.local.map(x=>`${x.type} ${x.proto} ${x.addr}:${x.port}${x.url?' ['+x.url+']':''}`).join('\n'):'')],
  ['相手の候補',fmtCnt(rc)+(P.remote.length?'\n'+P.remote.map(x=>`${x.type} ${x.proto} ${x.addr}:${x.port}`).join('\n'):'')],
  ['ICEエラー',P.errors.length?P.errors.map(e=>`${e.code} ${e.text||''} ${e.url||''}`).join('\n'):'なし',P.errors.length?'ng':''],
  ['往復遅延(DC)',r?`最新 ${ms(r.last)} / 平均 ${ms(r.avg)} / 最小 ${ms(r.min)} / 最大 ${ms(r.max)}`:'-'],
  ['ping送信/応答',`${P.sent} / ${P.got}`+(lp!=null?` (損失 約${lp.toFixed(0)}%)`:'')],
  ['通信量',P.pair?`送信 ${P.pair.bs||0}B / 受信 ${P.pair.br||0}B / 推定上り ${P.pair.out?Math.round(P.pair.out/1000)+'kbps':'-'}`:'-']
 ];
 return rows;
}
function envRows(){
 const k=navigator.connection;
 return[['ブラウザ',navigator.userAgent],['オンライン',navigator.onLine?'はい':'いいえ'],
  ['回線情報',k?`${k.type||'-'} / ${k.effectiveType||'-'} / ${k.downlink||'-'}Mbps / rtt ${k.rtt||'-'}ms${k.saveData?' / データセーバーON':''}`:'取得不可'],
  ['ページの場所',location.protocol+'//'+(location.host||'(file)')],
  ['WebRTC',typeof RTCPeerConnection!=='undefined'?'使えます':'使えません'],
  ['Firebase SDK',typeof firebase!=='undefined'?'読み込み済み':'未読込'],
  ['ICEサーバー',RTC_CONFIG.iceServers.map(s=>s.urls).join('\n')]];
}
function statusRows(){
 const f=S.fb;
 return[['役割',S.role==='host'?'ホスト':S.role==='guest'?'ゲスト':'-'],['自分のID',S.uid||'-'],['ホストのID',S.hostUid||'-'],
  ['匿名ログイン',f.auth!=null?ms(f.auth):'-'],['Firebase接続',f.conn==null?'-':(f.conn?'接続中':'切断')],
  ['Firebase書込/読込',f.write!=null?`${ms(f.write)} / ${ms(f.read)}`:'-'],['経過',S.role!=='-'?((now()-tStart)/1000).toFixed(1)+'秒':'-']];
}
const table=rows=>'<table>'+rows.map(([k,v,c])=>`<tr><th>${E(k)}</th><td class="${c||''}">${E(v)}</td></tr>`).join('')+'</table>';
function render(){
 $('env').innerHTML=table(envRows());
 $('status').innerHTML=table(statusRows());
 $('diag').innerHTML=diagnose().map(i=>`<li class="${i.lv}">${E(i.text)}</li>`).join('')||'<li class="info">接続するとここに診断結果が出ます</li>';
 $('peers').innerHTML=[...S.peers.values()].map(P=>`<h3>相手: ${E(nm(P))}</h3>`+table(peerRows(P))).join('')||'<p class="dim small">まだ接続相手がいません</p>';
 $('srvres').innerHTML=S.srv?table(S.srv.map(r=>[r.url,r.txt,r.cls])):'';
}
setInterval(render,500);render();

async function testServer(s){
 const res={cands:{},errors:[],ms:null};
 const pc=new RTCPeerConnection({iceServers:[s]});pc.createDataChannel('x');
 const t=now();let done;const p=new Promise(r=>{done=r;});
 pc.onicecandidate=e=>{if(!e.candidate){done();return;}const ty=e.candidate.type;if(ty==='srflx'||ty==='relay'){res.cands[ty]=(res.cands[ty]||0)+1;if(res.ms==null)res.ms=now()-t;}};
 pc.onicecandidateerror=e=>res.errors.push(`${e.errorCode} ${e.errorText||''} ${HINT[e.errorCode]?'→'+HINT[e.errorCode]:''}`);
 await pc.setLocalDescription(await pc.createOffer());
 const to=setTimeout(done,8000);await p;clearTimeout(to);pc.close();return res;
}
async function testServers(){
 if(typeof RTCPeerConnection==='undefined')return;
 $('srv').disabled=true;S.srv=[];
 for(const s of RTC_CONFIG.iceServers){
  const row={url:s.urls,txt:'テスト中…（最大8秒）'};S.srv.push(row);
  const r=await testServer(s),want=/^turns?:/.test(s.urls)?'relay':'srflx',ok=!!r.cands[want];
  row.cls=ok?'ok':'ng';
  row.txt=(ok?'✓ 成功 ':'✗ 失敗 ')+`(${ms(r.ms)}) 取得: ${JSON.stringify(r.cands)}`+(r.errors.length?'\nエラー: '+[...new Set(r.errors)].join(' / '):'')+(!ok&&!r.errors.length?'\n応答なし（ポートが遮断されている可能性）':'');
 }
 $('srv').disabled=false;
}
function report(){
 const L=[],sec=(t,rows)=>{L.push('■ '+t);rows.forEach(([k,v])=>L.push(`${k}: ${v}`));L.push('');};
 L.push('## P2P接続テスト結果 '+new Date().toString(),'');
 L.push('■ 診断');diagnose().forEach(i=>L.push(`[${i.lv}] ${i.text}`));L.push('');
 sec('状態',statusRows());
 S.peers.forEach(P=>sec('相手: '+nm(P),peerRows(P)));
 if(S.srv)sec('STUN/TURN単体テスト',S.srv.map(r=>[r.url,r.txt]));
 sec('環境',envRows());
 L.push('■ ログ',...logs);
 return L.join('\n');
}
async function copyReport(){
 const t=report();
 try{await navigator.clipboard.writeText(t);}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();}
 $('copy').textContent='コピーしました';setTimeout(()=>$('copy').textContent='結果をコピー',1500);
}
$('go').onclick=start;
$('again').onclick=async()=>{await stop();start();};
$('srv').onclick=testServers;
$('copy').onclick=copyReport;
$('room').addEventListener('keydown',e=>{if(e.key==='Enter')start();});
addEventListener('beforeunload',()=>{refs.forEach(f=>{try{f()}catch(e){}});});
</script>
